name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # M4.1: the images are built on every push so a broken Dockerfile is a red
  # check, not a surprise at deploy. Nothing is pushed to a registry yet.
  images:
    name: Build service images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: docker build --file Dockerfile.${{ matrix.service }} --tag runsphere-${{ matrix.service }}:ci .

      - name: Image runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id runsphere-${{ matrix.service }}:ci -u)"
          echo "uid=$uid"
          test "$uid" != "0"

      - name: Image carries no TypeScript sources or dev tooling
        run: |
          docker run --rm --entrypoint sh runsphere-${{ matrix.service }}:ci -c '
            ! find /app -name "*.ts" ! -name "*.d.ts" -not -path "*/node_modules/*" | grep -q . &&
            ! ls /app/node_modules/.pnpm | grep -qE "^(typescript|vitest|eslint|turbo|tsx)@"'

  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: runsphere_test
          POSTGRES_USER: runsphere
          POSTGRES_PASSWORD: runsphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runsphere -d runsphere_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      DATABASE_URL: postgresql://runsphere:runsphere_test@localhost:5432/runsphere_test
      AUTH_TOKEN_SECRET: ci-auth-token-secret-with-at-least-32-characters
      # These reach the test processes only because `turbo.json` lists them
      # under the `test` task's `env`. Turbo 2 runs tasks in strict env mode and
      # strips anything undeclared, and the failure is silent: every PostGIS
      # suite reports `skipped` and the run goes green. `requirePostgisInCi`
      # now fails loudly instead, but the list in `turbo.json` is what makes the
      # suites actually run.
      RUN_POSTGIS_INTEGRATION: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Validate infrastructure configuration tests
        run: ./infra/scripts/test-validate-config.sh

      - name: Verify PostGIS is available
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --command 'CREATE EXTENSION IF NOT EXISTS postgis;'
          ./scripts/infra/healthcheck-postgis.sh

      - name: Verify MapLibre New Architecture compatibility
        run: pnpm verify:maplibre

      # Static, no database needed. This is the check that catches a migration
      # seeding a value its own CHECK forbids — the defect milestone 3.12 found
      # by reading the SQL, which would otherwise fail on first apply.
      - name: Verify migrations statically
        run: pnpm verify:migrations

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Applied as its own step, after the build it imports, so a schema failure
      # is a red step that says "migrations" rather than surfacing later as a
      # confusing assertion inside whichever integration suite ran first.
      - name: Apply migrations
        run: pnpm migrate

      # Runs every suite, PostGIS integration included: the service container
      # and `RUN_POSTGIS_INTEGRATION` above are what open that gate, and
      # `requirePostgisInCi` fails the run if they ever stop doing so.
      - name: Test
        # One package at a time: the API and worker PostGIS suites share this
        # database, and the worker's season jobs (ranks, geo tags, warnings)
        # process every claim in the current season, so API claim tests
        # running in parallel leaked into their counts.
        run: pnpm turbo run test --continue --concurrency=1
