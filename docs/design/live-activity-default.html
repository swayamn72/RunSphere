<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RunSphere — Live Activity</title>
    <meta name="description" content="RunSphere mobile mockup: High-legibility live tracking map" />
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --ink: #10251f;
        --muted: #67766f;
        --cream: #f3f0e5;
        --card: #fffef8;
        --lime: #c9f15a;
        --moss: #184f3d;
        --teal: #168d77;
        --orange: #ff7048;
        --line: #d9dfd4;
        --blue: #78b8c6;
      }
      body {
        margin: 0;
        background: #dce3db;
        color: var(--ink);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      .phone {
        width: 390px;
        min-height: 844px;
        margin: 20px auto;
        background: var(--cream);
        position: relative;
        overflow: hidden;
        box-shadow: 0 18px 55px #1c352533;
        padding: 22px 20px 92px;
      }
      .status {
        height: 22px;
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        font-weight: 800;
        position: relative;
        z-index: 20;
      }
      .status div {
        display: flex;
        gap: 6px;
      }
      .top {
        height: 58px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        z-index: 10;
      }
      .top.brand {
        height: 70px;
      }
      .top.brand div {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .top.brand b {
        font-size: 18px;
      }
      .top small,
      .eyebrow {
        font-size: 11px;
        letter-spacing: 1.5px;
        font-weight: 900;
        color: var(--teal);
      }
      h1 {
        font-size: 34px;
        line-height: 1.04;
        margin: 8px 0 14px;
        letter-spacing: -1.4px;
      }
      h1 span {
        color: var(--teal);
      }
      h2 {
        margin: 3px 0;
        font-size: 21px;
      }
      h3 {
        margin: 0;
        font-size: 17px;
      }
      .lead {
        font-size: 16px;
        line-height: 1.5;
        color: var(--muted);
        margin: 0 0 22px;
      }
      .center {
        text-align: center;
      }
      .muted {
        color: var(--muted);
      }
      button,
      input {
        font: inherit;
      }
      .icon,
      .dark-icon {
        border: 0;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #fff;
        border: 1px solid var(--line);
        font-size: 22px;
        color: var(--ink);
      }
      .dark-icon {
        background: #10251fdd;
        border-color: #ffffff44;
        color: #fff;
      }
      .avatar {
        border: 0;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--moss);
        color: #fff;
        font-weight: 900;
      }
      .primary {
        width: 100%;
        height: 56px;
        border: 0;
        border-radius: 18px;
        background: var(--moss);
        color: white;
        font-weight: 900;
        font-size: 16px;
        box-shadow: 0 7px 0 #0c382b;
        margin-top: 12px;
      }
      .primary span {
        float: right;
        margin-right: 15px;
      }
      .text-button {
        display: block;
        border: 0;
        background: transparent;
        color: var(--moss);
        font-weight: 800;
        margin: 18px auto;
      }
      .fine {
        font-size: 11px;
        line-height: 1.45;
        color: var(--muted);
        text-align: center;
      }
      .bottom-nav {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 76px;
        background: #fffef8f3;
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-around;
        z-index: 30;
        padding-bottom: 10px;
      }
      .bottom-nav button {
        border: 0;
        background: none;
        color: #7b8781;
        font-size: 10px;
        font-weight: 800;
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-items: center;
      }
      .bottom-nav button span {
        font-size: 20px;
      }
      .bottom-nav button.active {
        color: var(--teal);
      }
      .hero-orbit {
        height: 262px;
        margin: -10px -20px 15px;
        position: relative;
        background: linear-gradient(145deg, #123c30, #196751);
        overflow: hidden;
      }
      .orb {
        position: absolute;
        border: 1px solid #c9f15a77;
        border-radius: 50%;
      }
      .orb-a {
        width: 280px;
        height: 280px;
        left: -45px;
        top: -65px;
      }
      .orb-b {
        width: 190px;
        height: 190px;
        right: -50px;
        bottom: -55px;
      }
      .trail-line {
        width: 260px;
        height: 110px;
        border: 5px solid var(--lime);
        border-color: transparent transparent var(--lime) var(--lime);
        border-radius: 50%;
        transform: rotate(-18deg);
        position: absolute;
        left: 65px;
        top: 50px;
      }
      .hero-pin {
        position: absolute;
        left: 205px;
        top: 115px;
        color: var(--lime);
        font-size: 38px;
        filter: drop-shadow(0 6px 8px #0008);
      }
      .choice-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 20px 0 6px;
      }
      .choice {
        height: 78px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        text-align: left;
        padding: 14px;
      }
      .choice b,
      .choice small {
        display: block;
      }
      .choice small {
        margin-top: 5px;
        color: var(--muted);
      }
      .choice.active {
        border: 2px solid var(--teal);
        background: #e6f5df;
      }
      .step {
        font-size: 11px;
        font-weight: 900;
        color: var(--muted);
      }
      .mini-map {
        height: 170px;
        background: #dbe6d8;
        margin: 0 -20px 25px;
        position: relative;
        overflow: hidden;
        background-image:
          linear-gradient(30deg, transparent 48%, #fff 49%, #fff 52%, transparent 53%),
          linear-gradient(-20deg, transparent 42%, #b8d5d7 43%, #b8d5d7 52%, transparent 53%);
      }
      .route {
        position: absolute;
        width: 180px;
        height: 70px;
        border: 5px solid var(--teal);
        border-color: var(--teal) transparent transparent var(--teal);
        border-radius: 50%;
        left: 85px;
        top: 75px;
        transform: rotate(10deg);
      }
      .map-pin {
        position: absolute;
        left: 90px;
        top: 62px;
        color: var(--orange);
        font-size: 25px;
      }
      .privacy-shield {
        position: absolute;
        right: 35px;
        top: 30px;
        width: 58px;
        height: 64px;
        background: var(--moss);
        clip-path: polygon(50% 0, 95% 20%, 85% 74%, 50% 100%, 15% 74%, 5% 20%);
        display: grid;
        place-items: center;
        color: var(--lime);
        font-size: 25px;
        font-weight: 900;
      }
      .permission-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        margin: 10px 0;
      }
      .permission-card > div {
        display: grid;
        grid-template-columns: 38px 1fr;
        align-items: center;
      }
      .permission-card b,
      .permission-card small {
        grid-column: 2;
      }
      .permission-card small {
        color: var(--muted);
        font-size: 12px;
      }
      .perm-icon {
        grid-row: 1/3;
        font-size: 24px;
        color: var(--teal);
      }
      .status-pill {
        padding: 5px 8px;
        border-radius: 20px;
        background: #e2f0db;
        color: var(--moss);
        font-size: 10px;
        font-weight: 900;
      }
      .status-pill.optional {
        background: #ecece6;
        color: var(--muted);
      }
      .privacy-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 3px;
      }
      .privacy-row b,
      .privacy-row small {
        display: block;
      }
      .privacy-row small {
        color: var(--muted);
        margin-top: 3px;
      }
      .privacy-row input {
        display: none;
      }
      .privacy-row i {
        width: 46px;
        height: 27px;
        border-radius: 20px;
        background: var(--teal);
        position: relative;
      }
      .privacy-row i:after {
        content: '';
        width: 21px;
        height: 21px;
        background: #fff;
        border-radius: 50%;
        position: absolute;
        right: 3px;
        top: 3px;
      }
      .daily-card {
        background: var(--moss);
        color: #fff;
        border-radius: 24px;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }
      .daily-card:after {
        content: '';
        position: absolute;
        width: 180px;
        height: 180px;
        border: 1px solid #c9f15a55;
        border-radius: 50%;
        right: -80px;
        top: -80px;
      }
      .daily-head {
        display: flex;
        justify-content: space-between;
      }
      .daily-card .eyebrow {
        color: var(--lime);
      }
      .xp {
        font-size: 11px;
        font-weight: 900;
        background: var(--lime);
        color: var(--ink);
        padding: 7px 10px;
        border-radius: 20px;
      }
      .daily-card p {
        font-size: 13px;
        line-height: 1.4;
        color: #d5e3dc;
      }
      .quest-progress {
        height: 7px;
        background: #ffffff2b;
        border-radius: 8px;
      }
      .quest-progress span {
        height: 100%;
        display: block;
        background: var(--lime);
        border-radius: 8px;
      }
      .progress-label {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        margin-top: 7px;
      }
      .leaf-cluster {
        position: absolute;
        font-size: 35px;
        color: var(--lime);
        right: 25px;
        bottom: 12px;
        opacity: 0.22;
      }
      .leaf-cluster i,
      .leaf-cluster em {
        font-size: 23px;
      }
      .stat-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 12px 0;
      }
      .stat-row > div {
        padding: 15px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      .stat-row small,
      .stat-row b,
      .stat-row span {
        display: block;
      }
      .stat-row small {
        font-size: 9px;
        color: var(--muted);
        font-weight: 900;
        letter-spacing: 1px;
      }
      .stat-row b {
        font-size: 24px;
        margin: 5px 0;
      }
      .stat-row b i {
        font-size: 12px;
        font-style: normal;
      }
      .stat-row span {
        font-size: 10px;
        color: var(--teal);
      }
      .section-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 18px 2px 10px;
      }
      .section-title button {
        border: 0;
        background: none;
        color: var(--teal);
        font-weight: 800;
      }
      .section-title > span {
        font-size: 12px;
        color: var(--teal);
        font-weight: 800;
      }
      .near-card {
        display: grid;
        grid-template-columns: 72px 1fr 20px;
        gap: 12px;
        align-items: center;
        background: var(--card);
        border-radius: 16px;
        padding: 10px;
        border: 1px solid var(--line);
      }
      .near-card b,
      .near-card small,
      .near-card .reward {
        display: block;
      }
      .near-card small {
        font-size: 11px;
        color: var(--muted);
        margin: 4px 0;
      }
      .reward {
        font-size: 10px;
        color: var(--teal);
        font-weight: 800;
      }
      .near-card > button {
        border: 0;
        background: none;
        font-size: 24px;
      }
      .thumb {
        height: 64px;
        border-radius: 12px;
      }
      .terrain,
      .sunset {
        background: linear-gradient(
          150deg,
          #8dc7b1 0 35%,
          #3c8068 36% 50%,
          #f5cc69 51% 68%,
          #e87556 69%
        );
      }
      .thumb span {
        background: #10251fbb;
        color: white;
        font-size: 9px;
        padding: 4px 6px;
        border-radius: 10px;
        position: relative;
        top: 40px;
        left: 6px;
      }
      .start-fab {
        position: absolute;
        bottom: 86px;
        right: 20px;
        width: 82px;
        height: 82px;
        border-radius: 50%;
        border: 6px solid var(--cream);
        background: var(--orange);
        color: white;
        box-shadow: 0 7px 18px #7c382b55;
      }
      .start-fab span,
      .start-fab b {
        display: block;
      }
      .start-fab span {
        font-size: 20px;
      }
      .start-fab b {
        font-size: 11px;
        margin-top: 4px;
      }
      .full-bleed {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 535px;
      }
      .live-map,
      .offline-map {
        background: #cbd9cc;
        overflow: hidden;
      }
      .map-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(30deg, transparent 47%, #f7f4e8 48% 53%, transparent 54%),
          linear-gradient(-55deg, transparent 47%, #eef0e5 48% 54%, transparent 55%);
      }
      .water {
        position: absolute;
        width: 110%;
        height: 80px;
        background: #83bac1;
        top: 150px;
        left: -10px;
        transform: rotate(-12deg);
        border-radius: 50%;
      }
      .park {
        position: absolute;
        background: #93bd7c;
        border-radius: 45%;
      }
      .p1 {
        width: 140px;
        height: 100px;
        top: 40px;
        right: -20px;
      }
      .p2 {
        width: 120px;
        height: 90px;
        top: 290px;
        left: -25px;
      }
      .live-route,
      .result-route {
        position: absolute;
        width: 220px;
        height: 250px;
        border: 7px solid var(--orange);
        border-color: var(--orange) var(--orange) transparent transparent;
        border-radius: 50%;
        left: 80px;
        top: 100px;
        transform: rotate(14deg);
      }
      .me {
        position: absolute;
        background: var(--moss);
        color: #fff;
        border: 3px solid white;
        border-radius: 50%;
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        font-size: 15px;
        left: 160px;
        top: 275px;
      }
      .pulse:after {
        content: '';
        position: absolute;
        inset: -10px;
        border: 2px solid var(--teal);
        border-radius: 50%;
        opacity: 0.5;
      }
      .quest-dot {
        position: absolute;
        right: 70px;
        top: 105px;
        background: var(--lime);
        color: var(--moss);
        padding: 8px;
        border-radius: 50%;
      }
      .map-control {
        position: absolute;
        right: 16px;
        top: 245px;
        border: 0;
        border-radius: 12px;
        background: #fff;
        width: 44px;
        height: 44px;
        font-size: 20px;
      }
      .map-control.layers {
        top: 297px;
      }
      .live-header {
        position: absolute;
        top: 30px;
        left: 18px;
        right: 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 5;
      }
      .gps-good,
      .offline-pill {
        background: #10251fdd;
        color: #fff;
        border-radius: 22px;
        padding: 8px 12px;
        font-size: 11px;
        font-weight: 800;
      }
      .gps-good {
        color: #dfffa0;
      }
      .live-panel {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 340px;
        background: var(--ink);
        color: white;
        border-radius: 30px 30px 0 0;
        padding: 24px;
      }
      .live-mode {
        text-align: center;
        color: #b7c7bf;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 1.5px;
      }
      .hero-stat {
        text-align: center;
        margin: 3px 0 13px;
      }
      .hero-stat b {
        font-size: 72px;
        letter-spacing: -4px;
      }
      .hero-stat span {
        font-size: 18px;
        color: #b7c7bf;
        margin-left: 7px;
      }
      .live-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        text-align: center;
        border-top: 1px solid #ffffff20;
        padding-top: 16px;
      }
      .live-stats b,
      .live-stats small {
        display: block;
      }
      .live-stats b {
        font-size: 20px;
      }
      .live-stats small {
        font-size: 8px;
        color: #91a59c;
        margin-top: 5px;
      }
      .live-actions {
        display: flex;
        justify-content: space-around;
        align-items: center;
        margin-top: 24px;
      }
      .round {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: 1px solid #ffffff30;
        background: #ffffff12;
        color: #fff;
        font-size: 22px;
      }
      .round.pause {
        width: 72px;
        height: 72px;
        background: var(--lime);
        color: var(--ink);
        border: 0;
        font-weight: 900;
      }
      .search {
        height: 50px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 15px;
        display: flex;
        align-items: center;
        padding: 0 14px;
        gap: 10px;
      }
      .search input {
        border: 0;
        outline: 0;
        background: none;
        flex: 1;
      }
      .search button {
        border: 0;
        background: none;
      }
      .chips {
        display: flex;
        gap: 7px;
        overflow: hidden;
        margin: 12px 0;
      }
      .chips button,
      .tags span {
        white-space: nowrap;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #fff;
        padding: 7px 11px;
        font-size: 11px;
      }
      .chips .selected {
        background: var(--moss);
        color: #fff;
      }
      .discovery-map {
        height: 245px;
        margin: 0 -20px;
        position: relative;
        background: #cbd9cc;
        background-image: linear-gradient(35deg, transparent 46%, #fff 47% 53%, transparent 54%);
      }
      .discovery-map .water {
        top: 80px;
      }
      .pin {
        position: absolute;
        background: var(--moss);
        color: var(--lime);
        border: 3px solid white;
        border-radius: 50% 50% 50% 5px;
        transform: rotate(-45deg);
        width: 45px;
        height: 45px;
        display: grid;
        place-items: center;
        font-size: 10px;
        font-weight: 900;
      }
      .pin1 {
        left: 55px;
        top: 38px;
      }
      .pin2 {
        right: 60px;
        top: 95px;
      }
      .pin3 {
        left: 155px;
        bottom: 30px;
      }
      .pin1,
      .pin2,
      .pin3 {
        padding: 0;
      }
      .pin::first-letter {
        transform: rotate(45deg);
      }
      .discovery-map .me {
        left: 185px;
        top: 110px;
      }
      .sheet-handle {
        height: 4px;
        width: 42px;
        background: #aeb8b1;
        border-radius: 4px;
        margin: 10px auto;
      }
      .quest-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        overflow: hidden;
      }
      .quest-art {
        height: 95px;
        position: relative;
      }
      .difficulty {
        position: absolute;
        left: 10px;
        top: 10px;
        background: #fff;
        padding: 5px 7px;
        border-radius: 10px;
        font-size: 9px;
        font-weight: 900;
      }
      .quest-copy {
        padding: 13px;
      }
      .quest-copy > div:first-child {
        display: flex;
        justify-content: space-between;
      }
      .quest-copy p {
        margin: 5px 0;
        font-size: 12px;
      }
      .meta {
        font-size: 10px;
        color: var(--muted);
      }
      .tags {
        display: flex;
        gap: 5px;
        margin-top: 8px;
      }
      .tags span {
        padding: 4px 7px;
        background: #edf3e8;
      }
      .result-burst {
        height: 110px;
        width: 110px;
        border-radius: 50%;
        background: var(--moss);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 15px auto;
        position: relative;
        box-shadow: 0 0 0 11px #dceaa7;
      }
      .result-burst span {
        font-size: 30px;
        font-weight: 900;
        color: var(--lime);
      }
      .result-burst small {
        font-size: 8px;
      }
      .result-burst i,
      .result-burst em {
        position: absolute;
        color: var(--orange);
        font-size: 24px;
      }
      .result-burst i {
        left: -30px;
        top: 10px;
      }
      .result-burst em {
        right: -35px;
        bottom: 8px;
      }
      .capture-map {
        height: 180px;
        background: #cbd9cc;
        border-radius: 20px;
        position: relative;
        overflow: hidden;
      }
      .capture-map .water {
        top: 60px;
      }
      .capture-map .result-route {
        width: 150px;
        height: 120px;
        top: 27px;
